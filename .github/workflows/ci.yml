name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# La CI legge e basta: niente deploy, niente commenti, niente release. Senza questo blocco il
# token riceverebbe i permessi predefiniti del repository, più di quanti ne servano.
permissions:
  contents: read

# Le action sono fissate al commit, non al tag: `v7` è un'etichetta che il proprietario può
# spostare, e con essa il codice che gira qui dentro. Il commento a fianco dice a quale
# versione corrisponde lo SHA; per aggiornarle si sostituiscono entrambi a mano.

jobs:
  frontend:
    name: Frontend (lint, format, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Allineato ai Dockerfile (node:24-*): la CI deve girare sullo stesso
          # runtime della produzione. Da alzare insieme alle immagini, non da solo.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (lint, format, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Allineato ai Dockerfile (node:24-*): la CI deve girare sullo stesso
          # runtime della produzione. Da alzare insieme alle immagini, non da solo.
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # I job qui sopra compilano nella working copy, dove ogni file è presente per
  # definizione: non accorgerebbero che il Dockerfile non copia un file di config
  # nuovo. Questo job costruisce le immagini reali con lo stesso comando usato
  # dall'aggiornamento automatico (scripts/update-server.sh), quindi una build di
  # produzione rotta fallisce qui invece che sul server.
  images:
    name: Production images (docker compose build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # docker compose interpola le variabili del compose file anche per `build`.
      # .env.example le fornisce tutte senza introdurre segreti reali, e di
      # riflesso verifica che resti allineato a docker-compose.yml.
      - run: docker compose --env-file .env.example build
