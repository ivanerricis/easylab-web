name: Release

# Parte solo quando si pubblica un tag di versione (`vX.Y.Z`, creato in locale con `git tag -s`).
# Non pubblica nulla sul server: il CT si aggiorna da solo dal tag, con i suoi script. Qui si
# controlla che il tag sia legittimo e si crea la pagina della release su GitHub.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Il token può scrivere sulle release e leggere l'esito della CI, niente altro.
permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Check the tag and create the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # La storia intera: servono `main` per sapere se il commit ci sta dentro, e il tag
          # precedente per le note.
          fetch-depth: 0

      # Le stesse chiavi che il CT usa per installare (ops/allowed_signers). La lista si legge
      # dal commit del tag, che a questo punto sta in `main`: chi non ha la chiave di firma
      # non può farsi ammettere da solo.
      - name: Tag is signed by an allowed key
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=ops/allowed_signers verify-tag "$TAG"

      - name: Tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # Una release non si fa da un commit su cui la CI è rossa o non è ancora finita.
      - name: CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh run list --workflow=CI --commit "$GITHUB_SHA" --json conclusion --jq '[.[].conclusion] | if length == 0 then "none" elif all(. == "success") then "success" else "failed" end')"
          echo "CI on $GITHUB_SHA: $conclusion"
          test "$conclusion" = "success"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --latest
