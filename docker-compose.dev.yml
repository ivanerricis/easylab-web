services:
  db:
    image: postgres:16
    container_name: postgres_db_dev
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend_dev
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LAB_NAME: ${LAB_NAME}
      LAB_EMAIL: ${LAB_EMAIL}
      LAB_ADDRESS: ${LAB_ADDRESS}
      LAB_PHONE: ${LAB_PHONE}
      LAB_LOGO_TEXT: ${LAB_LOGO_TEXT}
      # Solo in sviluppo: qui Vite gira su :5173 e chiama il backend su :3000, quindi le
      # richieste sono cross-origin davvero. In produzione la variabile non esiste e il
      # CORS non viene nemmeno attivato, perché nginx serve tutto dalla stessa origin.
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ./backend:/app
      - ${BACKUP_HOST_DIR}:/app/backups
      - backend_node_modules:/app/node_modules
    command: sh -c 'echo "DATABASE_URL=$$DATABASE_URL"; node migrate.js && npm run dev'
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend_dev
    restart: always
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_LOGO_URL: http://localhost:3000/assets/logo.jpg
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data_dev:
  backend_node_modules:
  frontend_node_modules: