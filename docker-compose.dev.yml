services:
  db:
    image: postgres:16
    container_name: postgres_db_dev
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    # Solo da questa macchina: con "5433:5432" il database di sviluppo, con le sue credenziali
    # di prova, rispondeva a chiunque sulla stessa rete. Gli strumenti locali (client SQL,
    # drizzle-kit) si collegano a localhost:5433 come prima.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend_dev
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LAB_NAME: ${LAB_NAME}
      LAB_EMAIL: ${LAB_EMAIL}
      LAB_ADDRESS: ${LAB_ADDRESS}
      LAB_PHONE: ${LAB_PHONE}
      # Solo in sviluppo: qui Vite gira su :5173 e chiama il backend su :3000, quindi le
      # richieste sono cross-origin davvero. In produzione la variabile non esiste e il
      # CORS non viene nemmeno attivato, perché nginx serve tutto dalla stessa origin.
      CORS_ORIGIN: http://localhost:5173
      # Qui il backend risponde su http: senza questa variabile il cookie di sessione sarebbe
      # `secure` (il default, vedi middleware/requireAuth.ts), e non tutti i browser lo
      # accettano da http, nemmeno su localhost.
      NODE_ENV: development
      # La CA di prova che firma il certificato di Mailpit (vedi il servizio mailpit qui sotto):
      # si aggiunge alle CA di sistema, non le sostituisce.
      NODE_EXTRA_CA_CERTS: /certs/mailpit-ca.crt
    volumes:
      - ./scripts/dev/certs/mailpit-ca.crt:/certs/mailpit-ca.crt:ro
      - ./backend:/app
      - ${BACKUP_HOST_DIR}:/app/backups
      - backend_node_modules:/app/node_modules
    # Senza l'echo di DATABASE_URL, tolto anche dal compose di produzione: stampava la password
    # del database nei log.
    command: sh -c 'node migrate.js && npm run dev'
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend_dev
    restart: always
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_LOGO_URL: http://localhost:3000/assets/logo.jpg
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Solo in sviluppo: cattura le email dell'app (gli avvisi delle ore di assistenza, i riepiloghi
  # degli interventi) senza spedirle davvero. L'interfaccia per leggerle è su
  # http://localhost:8025. In Impostazioni > Email: host mailpit, porta 1025, SSL/TLS spento
  # (cioè STARTTLS), qualsiasi utente e password. Solo da questa macchina, come il database.
  #
  # Il TLS non è facoltativo: `emailManager.buildTransporter` lo pretende, con il certificato
  # verificato. Il certificato lo crea `scripts/dev/mailpit-cert.sh` (una volta, prima di avviare),
  # firmato da una CA di prova che conosce solo il backend di sviluppo (`NODE_EXTRA_CA_CERTS`).
  mailpit:
    image: axllent/mailpit
    container_name: mailpit_dev
    restart: always
    environment:
      MP_SMTP_TLS_CERT: /certs/mailpit.crt
      MP_SMTP_TLS_KEY: /certs/mailpit.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
    volumes:
      - ./scripts/dev/certs/mailpit.crt:/certs/mailpit.crt:ro
      - ./scripts/dev/certs/mailpit.key:/certs/mailpit.key:ro
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  postgres_data_dev:
  backend_node_modules:
  frontend_node_modules: