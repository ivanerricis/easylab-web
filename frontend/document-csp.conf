# Content-Security-Policy del documento HTML dell'app, inclusa solo in `location = /index.html`
# (dove arrivano anche tutte le rotte della SPA, tramite il redirect interno di try_files).
#
# Si aggiunge all'header `frame-ancestors 'none'` di security-headers.conf, che resta valido
# ovunque: su index.html arrivano quindi due header CSP, e il browser li applica entrambi. La
# composizione è voluta: questa policy riguarda cosa può caricare ed eseguire una pagina, e
# non ha senso su JSON e PDF di /api/, dove `object-src 'none'` rischierebbe anzi di bloccare
# il visualizzatore PDF del browser.
#
# Perché ogni valore:
# - script-src 'self': la build di Vite non contiene script inline, solo moduli in /static/.
#   Uno script iniettato in una pagina non verrebbe eseguito: è il motivo per cui la policy esiste.
# - style-src 'unsafe-inline': sonner (i toast) e Radix (Dialog, Select, ScrollArea) inseriscono
#   elementi <style> a runtime. Un nonce non è praticabile con un index.html statico.
# - img-src data:: il QR della verifica in due passaggi arriva come data URL, e alcune icone
#   in index.css sono SVG incorporati.
# - connect-src 'self': il frontend parla solo con /api sulla stessa origin.
# - base-uri 'none': un <base> iniettato non può ridirigere i percorsi relativi.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; worker-src 'none'; manifest-src 'self'" always;
