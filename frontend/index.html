<!doctype html>
<html lang="it">
    <head>
        <meta charset="UTF-8" />
        <!-- Classico e senza defer/module: deve girare prima del primo paint per mettere la classe
         del tema su <html> ed evitare il lampo bianco prima che parta React. La CSP (script-src
         'self') lo permette perché è un file della stessa origine. -->
        <script src="/theme-init.js"></script>
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eaeff5" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080c10" />
        <link rel="icon" type="image/svg+xml" href="/easylab-favicon.svg?v=8" />
        <link rel="icon" type="image/png" sizes="32x32" href="/easylab-icon-32.png?v=8" />
        <link rel="apple-touch-icon" sizes="180x180" href="/easylab-icon-180-apple-touch.png?v=8" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="preload"
            href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <title>EasyLab</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
