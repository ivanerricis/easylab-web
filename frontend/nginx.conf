# Il backend ricava l'IP reale del client, che usa per il limite ai tentativi di login, da
# `CF-Connecting-IP` (backend/src/middleware/clientIp.ts). Sulla porta 80 arriva solo
# cloudflared, e Cloudflare quell'header lo sovrascrive sempre con l'IP vero: passa com'è.
# La 8080 esiste per l'accesso d'emergenza dalla LAN (vedi docker-compose.yml): lì l'header lo
# può scrivere chiunque, e passarlo com'è voleva dire un contatore nuovo a ogni richiesta,
# quindi tentativi illimitati. Su quella porta viene sostituito dall'indirizzo che nginx vede.
map $server_port $client_cf_connecting_ip {
  8080    $remote_addr;
  default $http_cf_connecting_ip;
}

server {
  listen 80;
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # I dump del database possono superare il default di 1 MB. Il tetto è allineato a quello
  # di multer sulla rotta di ripristino (512 MB): il backend tiene l'upload in memoria per
  # intero, quindi accettarne di più qui significherebbe solo far arrivare al container
  # richieste che poi rifiuta - o, prima che il limite esistesse, esaurirgli la RAM.
  # Nota: dietro Cloudflare il limite effettivo è quello del piano (100 MB per richiesta
  # sul piano free), più basso di questo. Il ripristino di un dump più grande va fatto
  # dalla VM con scripts/restore-db.sh, non dalla pagina Impostazioni.
  client_max_body_size 512m;

  include /etc/nginx/security-headers.conf;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $client_cf_connecting_ip;
  }

  location /assets/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $client_cf_connecting_ip;
  }

  # Gli asset della build hanno l'hash nel nome (index-CXPEiXJP.js), quindi cambiano
  # nome a ogni build e si possono cachare per sempre. Il =404 è la parte importante:
  # senza, il fallback su /index.html risponderebbe 200 con HTML a una richiesta di
  # JavaScript, e l'import dinamico di una pagina fallirebbe con un errore MIME oscuro
  # invece di un 404 leggibile.
  location /static/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
  }

  # index.html non ha l'hash nel nome: va rivalidato a ogni apertura, altrimenti dopo
  # un aggiornamento il browser continua a servire dalla cache la pagina vecchia, che
  # chiede i chunk della build precedente (ormai spariti dall'immagine).
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    include /etc/nginx/document-csp.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}