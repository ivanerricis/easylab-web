# Header di sicurezza, inclusi in ogni location che ne definisce di propri.
#
# In nginx `add_header` non si somma per ereditarietà: un `add_header` dentro un location
# annulla tutti quelli ereditati dal blocco server. Le location che impostano
# Cache-Control devono quindi includere di nuovo questo file, altrimenti index.html e gli
# asset statici resterebbero senza header di sicurezza.

# Impedisce al browser di indovinare il tipo di contenuto ignorando il Content-Type.
add_header X-Content-Type-Options "nosniff" always;
# L'app non va mai incorniciata in un iframe: nessuna funzione lo richiede. Il resto della
# CSP, che riguarda solo il documento HTML, sta in document-csp.conf.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
# Il referrer non deve uscire verso terzi: gli URL contengono id di report e clienti.
add_header Referrer-Policy "same-origin" always;
# L'app pubblica risponde solo in HTTPS dietro Cloudflare Tunnel: una volta visitata, il
# browser non deve più tentare la versione in chiaro.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
